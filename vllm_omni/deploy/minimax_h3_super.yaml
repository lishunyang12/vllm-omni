# MiniMax H3 Super Acceleration: 4-step H3 Turbo draft + 3-step LTX-2.5 refiner.
# The official profile assigns one GPU to each serial stage (two GPUs/request).
pipeline: minimax_h3_super
async_chunk: false
trust_remote_code: true
distributed_executor_backend: mp

stages:
  - stage_id: 0
    model: MiniMaxAI/MiniMax-H3
    devices: "0"
    model_class_name: MiniMaxH3SuperDraftPipeline
    task_type: fl2va
    max_num_seqs: 1
    enforce_eager: true
    lora_backend: peft
    additional_config:
      taeh3_checkpoint: https://raw.githubusercontent.com/madebyollin/taehv/e589fddc076e77f5ba8cd6baabe4ba3260b261cd/taeh3.pth
    default_sampling_params:
      seed: 50803
      height: 512
      width: 896
      fps: 24
      num_inference_steps: 5
      lora_request:
        lora_name: lx2v_4s_v01_544p
        lora_int_id: 1
        lora_path: lightx2v/Minimax-h3-Turbo
      lora_scale: 0.0625
      extra_args:
        task: fl2va
        duration: 5.0
        flow_shift: 12.0
        audio_flow_shift: 3.0

  - stage_id: 1
    model: Lightricks/LTX-2.5-Diffusers
    devices: "1"
    model_class_name: LTX25H3RefinerPipeline
    max_num_seqs: 1
    enforce_eager: false
    diffusion_compile_dynamic: false
    vae_use_tiling: true
    additional_config:
      taehv_checkpoint: https://raw.githubusercontent.com/madebyollin/taehv/32ac0146b11007cda5a57b60a3b35653361fb8a4/taeltx2_3_wide.pth
      encode_output_video: true
    default_sampling_params:
      seed: 50803
      height: 768
      width: 1344
      num_frames: 121
      fps: 24
      num_inference_steps: 3

edges:
  - from: 0
    to: 1
    window_size: -1
    max_inflight: 1
